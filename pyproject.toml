[project]
name = "adb-mcp"
version = "0.1.0"
description = "Turn `adb` into a full MCP surface — control your Android phone from any AI agent: tap, swipe, screencap, install, logcat."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0",
    "fastmcp>=2.0",
]

[project.scripts]
adb-mcp = "adb_mcp.server:main"

[tool.uv]
dev-dependencies = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adb_mcp"]